# clang-tidy is a static analysis tool - it reads the C++ code and checks for
# bugs, bad practices, and style issues without actually running the code.
# The checks it runs are configured in the .clang-tidy file at the root of the
# repository.
#
# Unlike clang-format (which is purely about whitespace and style), clang-tidy
# actually understands what the code does. This means it needs to know how the
# code is compiled - which headers to include, which flags to use, etc. We
# provide this via a compile_commands.json file generated by Gradle.
#
# If this check fails on your PR, run clang-tidy locally to see the issues.
# First, generate the compile database (only needed once per build):
#   ./gradlew compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands
# Then check a single file:
#   clang-tidy -p build/BinaryCompileCommands/compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands <file>
# Or to check all changed files at once in PowerShell:
#   $db = "build/BinaryCompileCommands/compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands"
#   $files = git diff --name-only origin/main...HEAD | Where-Object { $_ -match '^src/main/cpp/.*\.cpp$' }
#   if ($files) { $files | ForEach-Object { clang-tidy -p $db $_ } }
# Or in bash:
#   DB="build/BinaryCompileCommands/compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands"
#   git diff --name-only origin/main...HEAD | grep -E '^src/main/cpp/.*\.cpp$' | xargs clang-tidy -p "$DB"
# clang-tidy can automatically fix some issues (mostly modernize-* and
# readability-* checks). Not all checks support this — bugprone-* issues flag
# potential logic errors that need manual review. To auto-fix in PowerShell:
#   $files | ForEach-Object { clang-tidy -p $db --fix $_ }
# Or in bash:
#   git diff --name-only origin/main...HEAD | grep -E '^src/main/cpp/.*\.cpp$' | xargs clang-tidy -p "$DB" --fix
name: clang-tidy

on:
  # Only runs on pull requests targeting main.
  pull_request:
    branches: [main]

jobs:
  clang-tidy:
    name: Check clang-tidy
    # We use our build server here because clang-tidy is slow as it needs to 
    # resolve all the #includes in our code (WPILib, CTRE, REV, etc.).
    runs-on: self-hosted
    container: wpilib/roborio-cross-ubuntu:2025-24.04
    permissions:
      contents: read

    steps:
      # Check out the full git history so we can diff against the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The container runs as a different user than the one who owns the
      # checked-out files, so git would refuse to operate on the repo without
      # this safety override.
      - name: Declare repo as git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Find which .cpp files were added or modified in this PR.
      # We only check .cpp files (not headers) because clang-tidy works on
      # translation units. It analyzes headers automatically when they are
      # #included by a .cpp file. The --header-filter flag below controls
      # which header diagnostics get reported.
      # We only check changed files so pre-existing issues don't block
      # unrelated PRs.
      - name: Get changed .cpp files
        id: changed-files
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
            | grep -E '^src/main/cpp/.*\.cpp$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # clang-tidy is not pre-installed in the WPILib container. Install it.
      - name: Install clang-tidy
        if: steps.changed-files.outputs.files != ''
        run: apt-get update -qq && apt-get install -y clang-tidy

      # Generate a compile_commands.json file, which tells clang-tidy 
      # how each source file is compiled (include paths, flags, defines, etc.).
      # We use the linuxathena debug variant because:
      #   - It targets the actual robot hardware used at comp.
      #   - Debug is faster to generate because it doesn't run optimization.
      # The output lands in build/BinaryCompileCommands/<taskname>/.
      - name: Generate compile_commands.json
        if: steps.changed-files.outputs.files != ''
        run: ./gradlew compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands

      # Run clang-tidy on each changed .cpp file in parallel (one process per
      # CPU core) to keep the total runtime reasonable.
      # --header-filter limits diagnostic output to our own headers only -
      # without this, clang-tidy would also report issues inside WPILib and
      # vendor library headers which we can't fix.
      # --warnings-as-errors causes any active check to fail the build, not
      # just print a warning.
      - name: Run clang-tidy
        if: steps.changed-files.outputs.files != ''
        run: |
          COMPILE_DB="build/BinaryCompileCommands/compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands"
          if ! echo "${{ steps.changed-files.outputs.files }}" \
            | grep -v '^$' \
            | xargs -P"$(nproc)" -I{} \
              clang-tidy \
                -p "$COMPILE_DB" \
                --header-filter="$GITHUB_WORKSPACE/src/main/include/.*" \
                --warnings-as-errors='*' \
                {}; then
            echo ""
            echo "clang-tidy found issues. To run locally, first generate the compile database:"
            echo "  ./gradlew compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands"
            echo ""
            echo "Then check your changed files (PowerShell):"
            echo '  $db = "build/BinaryCompileCommands/compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands"'
            echo '  $files = git diff --name-only origin/main...HEAD | Where-Object { $_ -match "^src/main/cpp/.*\.cpp$" }'
            echo '  if ($files) { $files | ForEach-Object { clang-tidy -p $db $_ } }'
            echo ""
            echo "Or in bash:"
            echo '  DB="build/BinaryCompileCommands/compileFrcUserProgramLinuxathenaDebugExecutableFrcUserProgramCppCompileCommands"'
            echo '  git diff --name-only origin/main...HEAD | grep -E "^src/main/cpp/.*\.cpp$" | xargs clang-tidy -p "$DB"'
            echo ""
            echo "Some issues can be fixed automatically with --fix (modernize-* and readability-* checks)."
            echo "bugprone-* issues flag logic errors and need manual review."
            exit 1
          fi
