name: clang-tidy

on:
  pull_request:
    branches: [main]

jobs:
  clang-tidy:
    name: Check clang-tidy
    runs-on: self-hosted
    container: wpilib/roborio-cross-ubuntu:2025-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Declare repo as git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get changed .cpp files
        id: changed-files
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
            | grep -E '^src/main/cpp/.*\.cpp$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate compile_commands.json
        if: steps.changed-files.outputs.files != ''
        run: ./gradlew compileCommands

      - name: Run clang-tidy
        if: steps.changed-files.outputs.files != ''
        run: |
          FAILED=0
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "--- $FILE ---"
            if ! clang-tidy \
              -p compile_commands.json \
              --header-filter="$GITHUB_WORKSPACE/src/main/include/.*" \
              --warnings-as-errors='*' \
              "$FILE" 2>&1; then
              echo "::error file=$FILE::clang-tidy found issues in $FILE"
              FAILED=1
            fi
          done <<< "${{ steps.changed-files.outputs.files }}"
          exit $FAILED
